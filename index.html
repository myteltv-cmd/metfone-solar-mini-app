function t(k){return (T[state.lang]||T.en)[k]||T.en[k]||k} function money(n){return '$'+Math.round(n).toLocaleString('en-US')} function maxValue(p){return p.monthly*.15}
function media(src,title='',cls='landscape',reveal=false){if(reveal)return `<div class="reveal" onclick="openViewer('${src}','${esc(title)}')"><span class="rotate-hint">↻ Rotate your phone to read</span><img src="${src}" alt="${esc(title)}" loading="lazy" onerror="imgFail(this)"><span class="zoom">⛶</span></div>`;return `<div class="media ${cls}" onclick="openViewer('${src}','${esc(title)}')"><img src="${src}" alt="${esc(title)}" loading="lazy" onerror="imgFail(this)"><span class="zoom">⛶</span><span class="caption">${esc(title)}</span></div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;')}
function imgFail(el){el.outerHTML='<div class="img-error">Image unavailable</div>'}
function openViewer(src,title=''){document.getElementById('viewerImg').src=src;document.getElementById('viewerImg').alt=title;document.getElementById('viewerTitle').textContent=title||'';document.getElementById('viewer').classList.remove('hidden');document.body.classList.add('no-scroll')}
function closeViewer(){document.getElementById('viewer').classList.add('hidden');document.getElementById('viewerImg').src='';document.body.classList.remove('no-scroll')}
document.getElementById('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeViewer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
function nav(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'});document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.go===page))}
function setLang(l){state.lang=l;localStorage.setItem('mfSolarLang',l);document.documentElement.lang=l;document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===l));render()}

function packageCard(p){const max=maxValue(p);return `<article class="card package"><div class="package-media">${media(p.image,p.name,'landscape')}</div><div class="package-body"><span class="tag">✓ ${t('included')}</span><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="package-sub">${p.panels} · ${p.kwp.toFixed(2)} kWp · ${p.inv}</div><div class="specs"><div class="spec"><span>Solar</span><b>${p.kwp.toFixed(2)} kWp</b></div><div class="spec"><span>${t('battery')}</span><b>5.12 kWh</b></div><div class="spec"><span>${t('estimate')}</span><b>~${p.monthly.toLocaleString()} kWh</b></div><div class="spec"><span>${t('maxsave')}</span><b>${money(max)}/${t('month')}</b></div></div><div class="saving">${t('up')} <strong>${money(max)}</strong> / ${t('month')} · <strong>${money(max*12)}</strong> / ${t('year')}</div><div class="btnrow"><button class="btn primary" onclick="choosePackage('${p.id}')">${t('select')}</button><button class="btn ghost" onclick="openViewer('${p.image}','${esc(p.name)}')">⛶ ${t('zoom')}</button></div><div class="note" style="margin-top:8px">${t('disclaimer')}</div></div></article>`}
function packagesPage(){return `<section class="screen"><div class="section-head"><h2>${t('packages')}</h2></div><div class="card" style="margin-bottom:13px"><b>${t('packageSub')}</b><div class="note" style="margin-top:7px">${t('battery')} · AC/DC protection · installation & accessories</div></div><div class="packages">${packages.map(packageCard).join('')}</div><div class="card" style="margin-top:14px">${media(img.back,t('customTitle'),'landscape')}<h3 style="margin:12px 0 5px">${t('customTitle')}</h3><p class="note">${t('customP')}</p><button class="btn primary" onclick="openLead('survey')">${t('bookNow')}</button></div></section>`}
function calc(){const bill=Number(state.bill)||0;const kwh=Number(state.kwh)||(bill/0.15);const target=state.usage==='day'?1:state.usage==='night'?0.78:0.9;let best=null;for(const p of packages){const cov=Math.min(100,(p.monthly*target/Math.max(kwh,.01))*100);if(!best&&cov>=55)best={p,cov}}if(!best)best={p:packages[3],cov:Math.min(100,(packages[3].monthly*target/Math.max(kwh,.01))*100)};const impliedKwp=kwh/(30*5*.85);if(impliedKwp>10.2)return{custom:true,cov:Math.min(100,(10.2*30*5*.85*target/Math.max(kwh,.01))*100),kwp:impliedKwp};return best}
function advisorPage(){return `<section class="screen"><div class="section-head"><h2>${t('advisor')}</h2></div><div class="card"><p class="note">${t('advisorSub')}</p><label class="lbl">${t('bill')}</label><div class="btnrow">${[100,200,300,500,1000].map(v=>`<button class="btn ${Number(state.bill)===v?'primary':'ghost'}" onclick="state.bill=${v};render()">$${v}</button>`).join('')}<button class="btn ghost" onclick="customBill()">Other</button></div><input class="input" style="margin-top:9px" type="number" min="0" step="1" value="${state.bill||''}" oninput="state.bill=this.value" placeholder="$300"><label class="lbl">${t('kwh')}</label><input class="input" type="number" min="0" step="1" value="${state.kwh}" oninput="state.kwh=this.value" placeholder="e.g. 1200"><label class="lbl">${t('usage')}</label>${[['day','☀️',t('day')],['night','🌙',t('nightUse')],['both','☀️🌙',t('both')]].map(x=>`<label class="choice ${state.usage===x[0]?'selected':''}"><input type="radio" name="usage" ${state.usage===x[0]?'checked':''} onchange="state.usage='${x[0]}';render()"><span><b>${x[1]} ${x[2]}</b></span></label>`).join('')}<label class="lbl">${t('goal')}</label>${[['saving','💰',t('savingGoal')],['backup','🔋',t('backupGoal')],['depend','⚡',t('dependGoal')],['value','🎯',t('valueGoal')]].map(x=>`<label class="choice ${state.goal===x[0]?'selected':''}"><input type="radio" name="goal" ${state.goal===x[0]?'checked':''} onchange="state.goal='${x[0]}';render()"><span><b>${x[1]} ${x[2]}</b></span></label>`).join('')}<button class="btn primary" style="width:100%;margin-top:16px" onclick="showRecommendation()">${t('calculate')}</button></div><div id="recommendation" style="margin-top:13px"></div></section>`}
function showRecommendation(){const r=calc();state.selected=r.custom?'custom':r.p.id;render();setTimeout(()=>document.getElementById('recommendation')?.scrollIntoView({behavior:'smooth',block:'start'}),80)}
function recommendation(){const r=calc();if(r.custom)return `<div class="result"><div class="kicker">${t('recommend')}</div><h2>${t('customTitle')}</h2><div class="resultgrid"><div class="resultbox"><span>Estimated Solar</span><b>~${r.kwp.toFixed(1)} kWp</b></div><div class="resultbox"><span>${t('coverage')}</span><b>${Math.round(r.cov)}%</b></div><div class="resultbox"><span>${t('investment')}</span><b>${t('custom')}</b></div><div class="resultbox"><span>${t('battery')}</span><b>Custom BESS</b></div></div><div class="bar"><i style="width:${Math.min(100,r.cov)}%"></i></div><p class="note" style="color:#cbd0d8">${t('customP')} ${t('disclaimer')}</p><div class="btnrow"><button class="btn primary" onclick="openLead('survey')">${t('book')}</button><button class="btn secondary" onclick="nav('packages')">${t('compare')}</button></div></div>`;const p=r.p,max=maxValue(p);return `<div class="result">${media(p.image,p.name,'landscape')}<div class="kicker" style="margin-top:14px">${t('recommend')}</div><h2>${p.name}</h2><div class="resultgrid"><div class="resultbox"><span>Solar</span><b>${p.kwp.toFixed(2)} kWp</b></div><div class="resultbox"><span>${t('battery')}</span><b>5.12 kWh</b></div><div class="resultbox"><span>${t('investment')}</span><b>${money(p.price)}</b></div><div class="resultbox"><span>${t('maxsave')}</span><b>${money(max)}/mo</b></div></div><div class="bar"><i style="width:${Math.min(100,r.cov)}%"></i></div><div style="font-size:11px;font-weight:900">${t('coverage')}: ${Math.round(r.cov)}%</div><p class="note" style="color:#cbd0d8;margin-top:7px">${t('disclaimer')}</p><div class="btnrow"><button class="btn primary" onclick="choosePackage('${p.id}')">${t('select')}</button><button class="btn secondary" onclick="openLead('quote')">${t('request')}</button></div></div>`}
function planPage(){if(!state.selected)return `<section class="screen"><div class="card" style="margin-top:10px;text-align:center;padding:32px 18px"><div style="font-size:42px">☀️</div><h2>${t('plan')}</h2><p class="note">${t('planEmpty')}</p><div class="btnrow" style="justify-content:center"><button class="btn primary" onclick="nav('advisor')">${t('find')}</button><button class="btn ghost" onclick="nav('packages')">${t('packages')}</button></div></div></section>`;if(state.selected==='custom')return `<section class="screen"><div class="result"><div class="kicker">${t('plan')}</div><h2>${t('customTitle')}</h2><p style="color:#d4d7dd">${t('customP')}</p><div class="btnrow"><button class="btn primary" onclick="openLead('survey')">${t('book')}</button></div></div></section>`;const p=packages.find(x=>x.id===state.selected);return `<section class="screen"><div class="section-head"><h2>${t('plan')}</h2></div>${packageCard(p)}<div class="card" style="margin-top:13px"><button class="btn primary" style="width:100%" onclick="openLead('quote')">${t('request')}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="openLead('survey')">${t('book')}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="openLead('advisor')">${t('talk')}</button></div></section>`}
function openInfo(type){const data=type==='knowledge'?{title:t('knowledge'),image:img.knowledge,text:t('learnp')}:{title:t('structure'),image:img.structure,text:t('learnp')};document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>${data.title}</h2>${media(data.image,data.title,'portrait')}<p class="note" style="margin-top:10px">${data.text}</p>${media(img.system,t('how'),'landscape')}${media(img.hybrid,t('night'),'',true)}<button class="btn primary" style="width:100%;margin-top:10px" onclick="closeModal();nav('advisor')">${t('find')}</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function openLead(reason){document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>${reason==='survey'?t('book'):reason==='quote'?t('request'):t('talk')}</h2><p class="note">${t('contact')}</p><label class="lbl">${t('name')}</label><input class="input" id="leadName"><label class="lbl">${t('phone')}</label><input class="input" id="leadPhone"><label class="lbl">${t('location')}</label><input class="input" id="leadLocation"><label class="lbl">${t('property')}</label><select class="input" id="leadProperty"><option>${t('home')}</option><option>${t('business')}</option><option>${t('hotel')}</option><option>${t('factory')}</option><option>${t('other')}</option></select><label class="check"><input type="checkbox" id="consent"> <span>I agree that Metfone Solar may contact me regarding this request.</span></label><button class="btn primary" style="width:100%" onclick="submitLead()">${t('submit')}</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function submitLead(){const n=document.getElementById('leadName').value.trim(),p=document.getElementById('leadPhone').value.trim();if(!n||!p||!document.getElementById('consent').checked){toast('Please complete name, phone and consent.');return}state.lead={name:n,phone:p,location:document.getElementById('leadLocation').value,property:document.getElementById('leadProperty').value,selected:state.selected};console.log('Metfone Solar lead',state.lead);closeModal();toast(t('thanks'))}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function choosePackage(id){state.selected=id;nav('plan')}
function customBill(){const v=prompt('Monthly electricity bill (USD)',state.bill||300);if(v!==null){state.bill=Number(v)||0;render()}}
function render(){document.querySelectorAll('[data-t]').forEach(x=>x.textContent=t(x.dataset.t));let html=state.page==='home'?home():state.page==='packages'?packagesPage():state.page==='advisor'?advisorPage():planPage();document.getElementById('app').innerHTML=html;document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===state.lang));if(state.page==='advisor'&&state.selected)document.getElementById('recommendation').innerHTML=recommendation()}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.go)));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();document.documentElement.style.setProperty('--tg-bg',tg.backgroundColor||'#f5f6f8')}
render();
</script>
</body></html>
