let lang='en',page='home',selected=null,bill=0,kwh=0,usage='both';
function t(k){return (T[lang]&&T[lang][k])||T.en[k]||k}function money(n){return '$'+n.toLocaleString('en-US')}function go(p){page=p;render();scrollTo({top:0,behavior:'smooth'})}
function img(file,alt){return `<div class="visual"><img src="${A+file}" alt="${alt}" loading="lazy"><button class="zoom" onclick="openViewer('${A+file}','${alt.replaceAll("'",'')}')">⌕</button></div>`}
function home(){return `<div class="hero"><img src="${A}solar-energy-front-page.webp" alt="Metfone Solar"><div class="hero-copy"><h1>${t('hero')}</h1><p>${t('herop')}</p><div class="actions"><button class="btn primary" onclick="go('advisor')">${t('start')}</button><button class="btn light" onclick="document.getElementById('why').scrollIntoView({behavior:'smooth'})">${t('explore')}</button></div></div></div><section id="why" class="section"><div class="kicker">METFONE SOLAR</div><h2>${t('why')}</h2><p class="lead">${t('whySub')}</p><div class="trust"><h3>${t('trustTitle')}</h3><p>${t('trustCopy')}</p><div class="trust-quote">“${t('trustQuote')}”</div></div><div class="reasons"><div class="reason"><div class="num">01</div><b>${t('r1')}</b><span>${t('p1')}</span></div><div class="reason"><div class="num">02</div><b>${t('r2')}</b><span>${t('p2')}</span></div><div class="reason"><div class="num">03</div><b>${t('r3')}</b><span>${t('p3')}</span></div><div class="reason"><div class="num">04</div><b>${t('r4')}</b><span>${t('p4')}</span></div></div></section><section class="freedom"><div class="kicker">METFONE SOLAR</div><h2>${t('freedom')}</h2><p>${t('freedomCopy')}</p><div class="pillrow"><span class="pill">${t('create')}</span><span class="pill">${t('store')}</span><span class="pill">${t('use')}</span><span class="pill">${t('control')}</span></div></section><section class="section"><div class="kicker">HOW IT WORKS</div><h2>${t('how')}</h2>${img('he-tho-ng-ie-n-ma-t-tro-i.webp',t('how'))}<div class="how"><div class="step"><b>☀ ${t('solar')}</b><small>${t('day')}</small></div><div class="step"><b>▣ ${t('battery')}</b><small>${t('store')}</small></div><div class="step"><b>⌂ ${t('load')}</b><small>${t('use')}</small></div><div class="step"><b>↗ ${t('control')}</b><small>24/7</small></div></div></section><section class="section">${img('photo-2026-09-06-18-37-38.webp','Metfone Solar installation')}</section>`}
function advisor(){return `<div class="page-head"><div class="kicker">METFONE SOLAR ADVISOR</div><h1>${t('advisorTitle')}</h1><p class="lead">${t('advisorSub')}</p></div><div class="section" style="padding-top:18px"><div class="kicker">${t('max')}</div>${packages.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><b style="font-size:20px">${p.name}</b><div class="meta"><span class="tag">${p.kwp}</span><span class="tag">${p.phase}</span></div></div><div style="text-align:right"><div class="price">${money(p.price)}</div><small style="color:var(--muted)">incl. VAT</small></div></div><button class="btn" style="background:#f1f1f3;margin-top:8px" onclick="details('${p.id}')">${t('details')}</button></div>`).join('')}<div class="card"><label class="label">${t('bill')}</label><input class="input" id="billInput" type="number" min="0" placeholder="300" value="${bill||''}"><div class="quick"><button onclick="setBill(150)">$150</button><button onclick="setBill(250)">$250</button><button onclick="setBill(400)">$400</button><button onclick="setBill(600)">$600</button><button onclick="setBill(1000)">$1,000+</button></div><label class="label">${t('kwh')}</label><input class="input" id="kwhInput" type="number" min="0" placeholder="Optional" value="${kwh||''}"><label class="label">${t('usage')}</label><div class="grid2"><button class="choice ${usage==='day'?'selected':''}" onclick="setUsage('day')"><b>${t('dayUse')}</b><span>50% planning factor</span></button><button class="choice ${usage==='night'?'selected':''}" onclick="setUsage('night')"><b>${t('nightUse')}</b><span>50% planning factor</span></button><button class="choice ${usage==='both'?'selected':''}" onclick="setUsage('both')"><b>${t('both')}</b><span>90% planning factor</span></button></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="calculate()">${t('calculate')}</button></div><div id="rec">${selected?recommend():''}</div></div>`}
function setBill(v){bill=v;render();}function setUsage(v){usage=v;render()}
function calculate(){bill=Number(document.getElementById('billInput').value)||0;kwh=Number(document.getElementById('kwhInput').value)||0;const monthly=kwh||bill/.15;const factor=usage==='both'?.9:.5;const target=monthly*factor;const required=target/(30*5*.85);let p=packages.find(x=>parseFloat(x.kwp)>=required);selected=p?p.id:null;render();document.getElementById('rec')?.scrollIntoView({behavior:'smooth',block:'center'})}
function recommend(){if(!selected)return `<div class="recommend"><div class="rec-title">${t('custom')}</div><p class="muted">${t('customCopy')}</p><button class="btn primary" onclick="lead('survey')">${t('site')}</button></div>`;const p=packages.find(x=>x.id===selected);return `<div class="recommend"><div class="kicker" style="color:#ff6a78">${t('recommended')}</div><div class="rec-title">${p.name} · ${p.kwp}</div><p class="muted">${p.panels} · ${p.inv} · ${p.bat}</p><div class="money">${money(p.price)}</div><button class="btn primary" onclick="choose('${p.id}')">${t('select')}</button></div>`}
function packagesPage(){return `<div class="page-head"><div class="kicker">METFONE SOLAR</div><h1>${t('packagesTitle')}</h1><p class="lead">${t('packagesSub')}</p></div>${packages.map(p=>`<div class="card pkg"><div class="pkg-img"><img src="${A+p.img}" alt="${p.name}" loading="lazy"><button class="zoom" onclick="openViewer('${A+p.img}','${p.name}')">⌕</button></div><div class="pkg-body"><div style="display:flex;justify-content:space-between;gap:10px"><b style="font-size:21px">${p.name}</b><div class="price">${money(p.price)}</div></div><div class="meta"><span class="tag">${p.kwp}</span><span class="tag">${p.phase}</span><span class="tag">${p.panels}</span></div><p class="spec"><b>${t('included')}:</b> ${p.inv} · ${p.bat} · AC/DC protection · installation materials.</p><p class="spec" style="margin-top:8px"><b>${t('production')}:</b> ~${p.prod.toLocaleString()} kWh</p><button class="btn primary" style="margin-top:13px" onclick="choose('${p.id}')">${t('select')}</button></div></div>`).join('')}<div class="card" style="background:#111;color:#fff"><b style="font-size:20px">${t('over')}</b><p style="color:#bbb;line-height:1.5;font-size:13px">${t('overCopy')}</p><button class="btn primary" onclick="lead('survey')">${t('site')}</button></div>`}
function planPage(){if(!selected)return `<div class="page-head"><div class="kicker">MY PLAN</div><h1>${t('planTitle')}</h1><p class="lead">${t('planCopy')}</p></div><div class="empty">${t('empty')}<br><button class="btn primary" style="margin-top:14px" onclick="go('advisor')">${t('start')}</button></div>`;const p=packages.find(x=>x.id===selected);return `<div class="page-head"><div class="kicker">MY PLAN</div><h1>${t('planTitle')}</h1></div><div class="planhero"><div class="kicker" style="color:#ff6674">METFONE SOLAR</div><h2>${p.name}<br>${p.kwp}</h2><p>${p.panels} · ${p.inv} · ${p.bat}</p><div class="money">${money(p.price)}</div><button class="btn primary" onclick="lead('quote')">${t('quote')}</button> <button class="btn light" onclick="lead('survey')">${t('book')}</button></div>`}
function choose(id){selected=id;go('plan')}function details(id){const p=packages.find(x=>x.id===id);document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="kicker">METFONE SOLAR</div><h2>${p.name}</h2><p>${p.kwp} · ${p.phase} · ${money(p.price)} incl. VAT</p><div class="card" style="box-shadow:none;background:#f6f6f7"><b>PV</b><p>${p.panels}</p><b>Hybrid inverter</b><p>${p.inv}</p><b>Battery</b><p>${p.bat}</p><b>${t('production')}</b><p>~${p.prod.toLocaleString()} kWh</p></div><button class="btn primary" style="width:100%" onclick="choose('${p.id}');closeModal()">${t('select')}</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function lead(reason){document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="kicker">METFONE SOLAR</div><h2>${reason==='survey'?t('book'):t('quote')}</h2><p>${t('leadTitle')}</p><label class="label">${t('name')}</label><input class="input" id="leadName"><label class="label">${t('phone')}</label><input class="input" id="leadPhone"><label class="label">${t('location')}</label><select class="input" id="leadLocation"><option value="">${t('selectProvince')}</option>${provinces.map(x=>`<option>${x}</option>`).join('')}</select><label class="label">${t('property')}</label><select class="input" id="leadProperty"><option value="">${t('selectProperty')}</option>${properties.map(x=>`<option>${x}</option>`).join('')}</select><label class="check"><input type="checkbox" id="consent"><span>${t('consent')}</span></label><button class="btn primary" style="width:100%" onclick="submitLead()">${t('submit')}</button><p class="note">${t('note')}</p></div>`;document.getElementById('modal').classList.remove('hidden')}
function submitLead(){if(!document.getElementById('leadName').value||!document.getElementById('leadPhone').value||!document.getElementById('leadLocation').value||!document.getElementById('leadProperty').value||!document.getElementById('consent').checked){toast('Please complete the form');return}closeModal();toast(t('thanks'))}
function closeModal(){document.getElementById('modal').classList.add('hidden')}function openViewer(src,alt){document.getElementById('viewerImg').src=src;document.getElementById('viewerImg').alt=alt;document.getElementById('viewer').classList.add('show')}function closeViewer(){document.getElementById('viewer').classList.remove('show')}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function render(){document.getElementById('app').innerHTML=page==='home'?home():page==='advisor'?advisor():page==='packages'?packagesPage():planPage();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.go===page));document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeViewer();closeModal()}});render();
</script>
</body>
</html>
