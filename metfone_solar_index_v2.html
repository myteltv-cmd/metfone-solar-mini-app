function t(k){return (T[state.lang]||T.en)[k]||T.en[k]||k} function money(n){return '$'+Math.round(n).toLocaleString('en-US')} function maxValue(p){return p.monthly*.15}
function media(src,title='',cls='landscape',reveal=false){if(reveal)return `<div class="reveal" onclick="openViewer('${src}','${esc(title)}')"><span class="rotate-hint">↻ Rotate your phone to read</span><img src="${src}" alt="${esc(title)}" loading="lazy" onerror="imgFail(this)"><span class="zoom">⛶</span></div>`;return `<div class="media ${cls}" onclick="openViewer('${src}','${esc(title)}')"><img src="${src}" alt="${esc(title)}" loading="lazy" onerror="imgFail(this)"><span class="zoom">⛶</span><span class="caption">${esc(title)}</span></div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;')}
function imgFail(el){el.outerHTML='<div class="img-error">Image unavailable</div>'}
function openViewer(src,title=''){document.getElementById('viewerImg').src=src;document.getElementById('viewerImg').alt=title;document.getElementById('viewerTitle').textContent=title||'';document.getElementById('viewer').classList.remove('hidden');document.body.classList.add('no-scroll')}
function closeViewer(){document.getElementById('viewer').classList.add('hidden');document.getElementById('viewerImg').src='';document.body.classList.remove('no-scroll')}
document.getElementById('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeViewer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

<div class="section-head"><h2>${t('gallery')}</h2><span>${t('imageNote')}</span></div><div class="gallery">${media(img.front,'Metfone Solar','landscape')}${media(img.back,'Metfone Solar','landscape')}</div>
</section>`}
function packageCard(p){const max=maxValue(p);return `<article class="card package"><div class="package-media">${media(p.image,p.name,'landscape')}</div><div class="package-body"><div class="tag">${p.tag}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><p class="package-sub">${p.panels} · ${p.kwp.toFixed(2)} kWp · ${p.phase}</p><div class="specs"><div class="spec"><span>${t('inverter')}</span><b>${p.inv}</b></div><div class="spec"><span>${t('battery')}</span><b>GoodWe 5.12 kWh</b></div><div class="spec"><span>${t('production')}</span><b>~${p.monthly.toLocaleString()} kWh/mo</b></div><div class="spec"><span>${t('maxEnergyValue')}</span><b>${money(max)}/mo</b></div></div><div class="note">${t('packageIncludes')}</div><div class="btnrow"><button class="btn primary" onclick="choosePackage('${p.id}')">${t('select')}</button><button class="btn ghost" onclick="showPackageDetail('${p.id}')">${t('details')}</button></div></div></article>`}
function packagesPage(){return `<section class="screen"><div class="section-head"><h2>${t('packages')}</h2><span>${t('packageSub')}</span></div><div class="card intro-card"><h3>${t('packagesHeadline')}</h3><p class="note">${t('packagesIntro')}</p></div><div class="packages">${packages.map(packageCard).join('')}</div><div class="card custom-card">${media(img.back,t('customTitle'),'landscape')}<h3>${t('customTitle')}</h3><p class="note">${t('customP')}</p><button class="btn primary" onclick="openLead('survey')">${t('bookNow')}</button></div></section>`}
function usageFactor(){return state.usage==='both'?0.90:0.50}
function calc(){
 const bill=Number(state.bill)||0;
 const tariff=.15;
 const monthlyKwh=Number(state.kwh)||((bill/tariff)||0);
 const targetKwh=monthlyKwh*usageFactor();
 const requiredKwp=targetKwh/(30*5*.85);
 const p=packages.find(x=>x.kwp>=requiredKwp);
 if(!p) return {custom:true,requiredKwp,monthlyKwh,targetKwh,factor:usageFactor()};
 const coverage=Math.min(100,(p.monthly/monthlyKwh)*100);
 return {p,requiredKwp,monthlyKwh,targetKwh,factor:usageFactor(),coverage};
}
function advisorPage(){
 const factor=usageFactor();
 return `<section class="screen">
 <div class="section-head"><h2>${t('advisor')}</h2><span>${t('advisorSub')}</span></div>
 <div class="advisor-intro card"><div class="kicker">${t('advisorKicker')}</div><h3>${t('advisorHeadline')}</h3><p class="note">${t('advisorIntro')}</p></div>
 <div class="section-head"><h2>${t('maxSavingTitle')}</h2><span>${t('maxSavingSub')}</span></div>
 <div class="max-grid">${packages.map(p=>`<article class="max-card"><div class="max-image">${media(p.image,p.name,'landscape')}</div><div class="max-body"><div class="tag">${p.tag}</div><h3>${p.name}</h3><div class="max-number">~${p.monthly.toLocaleString()} <small>kWh / month</small></div><div class="max-value">${t('maxEnergyValue')}: <b>${money(maxValue(p))}/mo</b></div><button class="btn ghost" onclick="showPackageDetail('${p.id}')">${t('details')}</button></div></article>`).join('')}</div>
 <div class="card advisor-form">
   <div class="kicker">${t('yourBillKicker')}</div><h3>${t('billQuestion')}</h3>
   <label class="lbl">${t('bill')}</label>
   <div class="btnrow billchips">${[100,200,300,500,1000].map(v=>`<button class="btn ${Number(state.bill)===v?'primary':'ghost'}" onclick="state.bill=${v};render()">$${v}</button>`).join('')}</div>
   <input class="input" type="number" min="0" step="1" value="${state.bill||''}" oninput="state.bill=this.value" placeholder="$300">
   <label class="lbl">${t('usage')}</label>
   <div class="usage-grid">
   ${[['day','☀️',t('day'),t('dayFactor')],['night','🌙',t('nightUse'),t('nightFactor')],['both','☀️🌙',t('both'),t('bothFactor')]].map(x=>`<button class="usage-card ${state.usage===x[0]?'selected':''}" onclick="state.usage='${x[0]}';render()"><span>${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}
   </div>
   <div class="factor-note"><b>${Math.round(factor*100)}%</b> ${t('factorExplainer')}</div>
   <button class="btn primary" style="width:100%;margin-top:15px" onclick="showRecommendation()">${t('recommend')}</button>
 </div>
 <div id="recommendation" style="margin-top:13px"></div>
 </section>`}
function showRecommendation(){const r=calc();state.selected=r.custom?'custom':r.p.id;render();setTimeout(()=>document.getElementById('recommendation')?.scrollIntoView({behavior:'smooth',block:'start'}),80)}
function recommendation(){const r=calc();
 if(r.custom)return `<div class="result"><div class="kicker">${t('recommend')}</div><h2>${t('customTitle')}</h2><p style="color:#d4d7dd">${t('customP')}</p><div class="resultgrid"><div class="resultbox"><span>${t('requiredSolar')}</span><b>~${r.requiredKwp.toFixed(1)} kWp</b></div><div class="resultbox"><span>${t('usageTarget')}</span><b>${Math.round(r.factor*100)}%</b></div><div class="resultbox"><span>${t('monthlyBill')}</span><b>${money(state.bill)}</b></div><div class="resultbox"><span>${t('standardLimit')}</span><b>10 kW</b></div></div><p class="note" style="color:#cbd0d8">${t('customP')} ${t('disclaimer')}</p><div class="btnrow"><button class="btn primary" onclick="openLead('survey')">${t('book')}</button><button class="btn secondary" onclick="openLead('quote')">${t('request')}</button></div></div>`;
 const p=r.p,max=maxValue(p);return `<div class="result">${media(p.image,p.name,'landscape')}<div class="kicker" style="margin-top:14px">${t('recommend')}</div><h2>${p.name}</h2><p style="color:#d4d7dd">${t('recommendCopy')}</p><div class="resultgrid"><div class="resultbox"><span>${t('requiredSolar')}</span><b>~${r.requiredKwp.toFixed(1)} kWp</b></div><div class="resultbox"><span>${t('usageTarget')}</span><b>${Math.round(r.factor*100)}%</b></div><div class="resultbox"><span>${t('investment')}</span><b>${money(p.price)}</b></div><div class="resultbox"><span>${t('maxEnergyValue')}</span><b>${money(max)}/mo</b></div></div><div class="bar"><i style="width:${Math.min(100,r.coverage)}%"></i></div><div style="font-size:11px;font-weight:900">${t('estimatedCoverage')}: ${Math.round(r.coverage)}%</div><p class="note" style="color:#cbd0d8;margin-top:7px">${t('disclaimer')}</p><div class="btnrow"><button class="btn primary" onclick="choosePackage('${p.id}')">${t('select')}</button><button class="btn secondary" onclick="showPackageDetail('${p.id}')">${t('details')}</button></div></div>`}
function showPackageDetail(id){const p=packages.find(x=>x.id===id);const max=maxValue(p);document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="kicker">${p.tag}</div><h2>${p.name}</h2>${media(p.image,p.name,'landscape')}<div class="detail-price">${money(p.price)}</div><div class="detail-grid"><div><span>${t('solarPanel')}</span><b>${p.panels}</b></div><div><span>${t('solarCapacity')}</span><b>${p.kwp.toFixed(2)} kWp</b></div><div><span>${t('inverter')}</span><b>${p.inv}</b></div><div><span>${t('battery')}</span><b>${p.battery}</b></div><div><span>${t('phase')}</span><b>${p.phase}</b></div><div><span>${t('production')}</span><b>~${p.monthly.toLocaleString()} kWh/mo</b></div></div><div class="detail-list"><b>${t('includedTitle')}</b><p>• ${t('batteryIncluded')}<br>• ${t('protectionIncluded')}<br>• ${t('installationIncluded')}<br>• ${t('monitoringIncluded')}</p></div><div class="saving">${t('maxEnergyValue')}: <strong>${money(max)}</strong> / ${t('month')} · ${t('planningOnly')}</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="choosePackage('${p.id}');closeModal()">${t('chooseThis')}</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function planPage(){if(!state.selected)return `<section class="screen"><div class="plan-hero card"><div class="kicker">${t('planKicker')}</div><h2>${t('planEmptyTitle')}</h2><p>${t('planEmpty')}</p><button class="btn primary" onclick="nav('advisor')">${t('find')}</button></div></section>`;if(state.selected==='custom')return `<section class="screen"><div class="result"><div class="kicker">${t('planKicker')}</div><h2>${t('customPlanTitle')}</h2><p style="color:#d4d7dd">${t('customPlanCopy')}</p><button class="btn primary" onclick="openLead('survey')">${t('book')}</button></div></section>`;const p=packages.find(x=>x.id===state.selected);return `<section class="screen"><div class="section-head"><h2>${t('plan')}</h2><span>${t('planSub')}</span></div><div class="plan-hero card"><div class="kicker">${t('planKicker')}</div><h2>${t('planHeadline')}</h2><p>${t('planCopy')}</p></div>${packageCard(p)}<div class="card action-card"><h3>${t('planActionTitle')}</h3><p class="note">${t('planActionCopy')}</p><button class="btn primary" style="width:100%" onclick="openLead('quote')">${t('request')}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="openLead('survey')">${t('book')}</button></div></section>`}
function openInfo(type){const data=type==='knowledge'?{title:t('knowledge'),image:img.knowledge,text:t('learnp')}:{title:t('structure'),image:img.structure,text:t('learnp')};document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>${data.title}</h2>${media(data.image,data.title,'portrait')}<p class="note" style="margin-top:10px">${data.text}</p>${media(img.system,t('how'),'landscape')}${media(img.hybrid,t('night'),'',true)}<button class="btn primary" style="width:100%;margin-top:10px" onclick="closeModal();nav('advisor')">${t('find')}</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function openLead(reason){const provinces=['Phnom Penh','Banteay Meanchey','Battambang','Kampong Cham','Kampong Chhnang','Kampong Speu','Kampong Thom','Kampot','Kandal','Kep','Koh Kong','Kratie','Mondulkiri','Oddar Meanchey','Pailin','Preah Sihanouk','Preah Vihear','Pursat','Prey Veng','Ratanakiri','Siem Reap','Stung Treng','Svay Rieng','Takeo','Tboung Khmum'];const properties=[['home','Home / Villa'],['apartment','Apartment / Condominium'],['coffee','Coffee Shop / Café'],['restaurant','Restaurant'],['shop','Shop / Mini-mart'],['office','Office'],['hotel','Hotel / Guesthouse'],['factory','Factory / Workshop'],['clinic','Clinic'],['school','School'],['other','Other']];document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">×</button><div class="kicker">METFONE SOLAR</div><h2>${reason==='survey'?t('book'):reason==='quote'?t('request'):t('talk')}</h2><p class="note">${t('contact')}</p><label class="lbl">${t('name')}</label><input class="input" id="leadName" placeholder="Your name"><label class="lbl">${t('phone')}</label><input class="input" id="leadPhone" placeholder="Phone / Telegram"><label class="lbl">${t('location')}</label><select class="input" id="leadLocation"><option value="">${t('selectProvince')}</option>${provinces.map(x=>`<option>${x}</option>`).join('')}</select><label class="lbl">${t('property')}</label><select class="input" id="leadProperty"><option value="">${t('selectProperty')}</option>${properties.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><label class="check"><input type="checkbox" id="consent"> <span>${t('consent')}</span></label><button class="btn primary" style="width:100%" onclick="submitLead()">${t('submit')}</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function submitLead(){const n=document.getElementById('leadName').value.trim(),p=document.getElementById('leadPhone').value.trim();if(!n||!p||!document.getElementById('leadLocation').value||!document.getElementById('leadProperty').value||!document.getElementById('consent').checked){toast(t('completeForm'));return}state.lead={name:n,phone:p,location:document.getElementById('leadLocation').value,property:document.getElementById('leadProperty').value,selected:state.selected};console.log('Metfone Solar lead',state.lead);closeModal();toast(t('thanks'))}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function choosePackage(id){state.selected=id;nav('plan')}
function customBill(){const v=prompt('Monthly electricity bill (USD)',state.bill||300);if(v!==null){state.bill=Number(v)||0;render()}}
function render(){document.querySelectorAll('[data-t]').forEach(x=>x.textContent=t(x.dataset.t));let html=state.page==='home'?home():state.page==='packages'?packagesPage():state.page==='advisor'?advisorPage():planPage();document.getElementById('app').innerHTML=html;document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x.dataset.lang===state.lang));if(state.page==='advisor'&&state.selected)document.getElementById('recommendation').innerHTML=recommendation()}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.go)));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();document.documentElement.style.setProperty('--tg-bg',tg.backgroundColor||'#f5f6f8')}
render();
</script>
</body></html>
